name: Rust sample APK

# End-to-end check of the Export APK path: build a real Rust NativeActivity
# library for Android with Cargo and the NDK, package it with FoldCode's own
# packager, verify it with apksigner, and publish it so it can be installed on
# a phone. A blank window that stays open after launch means the APK works.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-sample-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    name: Build, package and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SAMPLE_DIR: docs/samples/rust-native-activity
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$sdk_root/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' -perm -111 -print | sort -V | tail -n 1)
          fi
          [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || { echo "sdkmanager not found" >&2; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Install Rust with the Android target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Build the Rust library for Android
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          bin="$sdk_root/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          # NativeActivity looks the entry point up by name, so the linker must keep it.
          export RUSTFLAGS="-C link-arg=-uANativeActivity_onCreate"
          cd "$SAMPLE_DIR"
          cargo build --release --target aarch64-linux-android
          lib=target/aarch64-linux-android/release/libhello_rust.so
          test -s "$lib"
          file "$lib"
          readelf -d "$lib" | grep NEEDED || true

      - name: Package with FoldCode's packager
        shell: bash
        env:
          FOLDCODE_REAL_LIB: ${{ github.workspace }}/docs/samples/rust-native-activity/target/aarch64-linux-android/release/libhello_rust.so
          FOLDCODE_REAL_CARGO_TOML: ${{ github.workspace }}/docs/samples/rust-native-activity/Cargo.toml
          FOLDCODE_REAL_APK_OUT: ${{ runner.temp }}/sample/hello-rust-native.apk
        run: |
          ./gradlew --no-daemon testDebugUnitTest \
            --tests 'dev.foldcode.ide.RealRustLibraryApkTest'
          test -s "$FOLDCODE_REAL_APK_OUT"

      - name: Verify with apksigner and aapt2
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          tools="$sdk_root/build-tools/36.0.0"
          apk="${{ runner.temp }}/sample/hello-rust-native.apk"
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$apk"
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | tee "${{ runner.temp }}/tree.txt"
          grep -q 'package="dev.foldcode.app.hello_rust"' "${{ runner.temp }}/tree.txt"
          grep -q 'hello_rust' "${{ runner.temp }}/tree.txt"
          unzip -l "$apk"

      - name: Publish APK as pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rust-sample-apk"
          notes="Sample Rust NativeActivity app packaged by FoldCode's APK packager (${GITHUB_SHA}). Each build is signed with a fresh key, so uninstall the previous build before installing a new one."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "Rust sample APK" --notes "$notes"
          else
            gh release edit "$tag" --notes "$notes"
          fi
          gh release upload "$tag" "${{ runner.temp }}/sample/hello-rust-native.apk" --clobber
