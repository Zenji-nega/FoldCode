name: Build APK

# Builds an installable debug APK (signed with the Android debug key) so it can
# be downloaded and installed straight from a phone. Run it from the Actions tab
# ("Run workflow") or by pushing to the rust-ide-improvements branch.

on:
  workflow_dispatch:
    inputs:
      base_runtime_repo:
        description: "Repository that publishes the foldcode-base-native bundle"
        default: "FifiLeih/FoldCode"
        required: false
      base_runtime_tag:
        description: "Release tag of the bundle (empty = latest release)"
        default: ""
        required: false
  push:
    branches:
      - rust-ide-improvements

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/cmdline-tools" ]]; then
            echo "Android SDK command-line tools are unavailable" >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$sdk_root/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' -perm -111 -print | sort -V | tail -n 1)
          fi
          [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || {
            echo "Could not locate sdkmanager" >&2
            exit 1
          }
          # sdkmanager closes stdin after the last license; `yes` then dies from
          # SIGPIPE even though acceptance succeeded.
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download verified base runtime bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REPO: ${{ inputs.base_runtime_repo || 'FifiLeih/FoldCode' }}
          RUNTIME_TAG: ${{ inputs.base_runtime_tag || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/base-runtime"
          args=(--repo "$RUNTIME_REPO" --pattern 'foldcode-base-native-*.zip' --dir "$RUNNER_TEMP/base-runtime")
          if [[ -n "$RUNTIME_TAG" ]]; then
            gh release download "$RUNTIME_TAG" "${args[@]}"
          else
            gh release download "${args[@]}"
          fi
          ls -l "$RUNNER_TEMP/base-runtime"
          bundle=$(ls "$RUNNER_TEMP"/base-runtime/foldcode-base-native-*.zip | head -n 1)
          # install-base-runtime.sh verifies every file's SHA-256 against the
          # bundle manifest before copying it into jniLibs.
          tools/install-base-runtime.sh "$bundle"

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        id: collect
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          [[ -n "$apk" ]] || { echo "No APK produced" >&2; exit 1; }
          mkdir -p dist
          cp "$apk" dist/FoldCode-debug.apk
          sha256sum dist/FoldCode-debug.apk | tee dist/FoldCode-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoldCode-debug-apk
          path: dist/
          retention-days: 30

      # A release asset downloads as a plain .apk, which is easier to install
      # from a phone browser than a zipped workflow artifact.
      - name: Publish APK as pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_REF_NAME//\//-}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease \
              --title "Debug APK (${GITHUB_REF_NAME})" \
              --notes "Automatic debug build of ${GITHUB_SHA}. Install FoldCode-debug.apk on an ARM64 Android device."
          else
            gh release edit "$tag" \
              --notes "Automatic debug build of ${GITHUB_SHA}. Install FoldCode-debug.apk on an ARM64 Android device."
          fi
          gh release upload "$tag" dist/FoldCode-debug.apk dist/FoldCode-debug.apk.sha256 --clobber
