name: APK packager check

# Runs the JVM tests for the on-device APK packager and then verifies a sample
# APK it produced with Google's own tools (apksigner and aapt2). The tests prove
# internal consistency; these tools prove that Android will accept the file.

on:
  workflow_dispatch:
  push:
    branches:
      - rust-ide-improvements
    paths:
      - "app/src/main/java/dev/foldcode/ide/apk/**"
      - "app/src/test/java/dev/foldcode/ide/NativeApkPackagerTest.kt"
      - "app/src/test/java/dev/foldcode/ide/RustApkExportTest.kt"
      - ".github/workflows/apk-packager-check.yml"

permissions:
  contents: read

concurrency:
  group: apk-packager-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packager:
    name: Packager tests and apksigner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$sdk_root/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' -perm -111 -print | sort -V | tail -n 1)
          fi
          [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || { echo "sdkmanager not found" >&2; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Run packager unit tests and write a sample APK
        shell: bash
        env:
          FOLDCODE_APK_TEST_OUT: ${{ runner.temp }}/apk-sample
        run: |
          ./gradlew --no-daemon testDebugUnitTest \
            --tests 'dev.foldcode.ide.NativeApkPackagerTest' \
            --tests 'dev.foldcode.ide.RustApkExportTest'
          test -s "$FOLDCODE_APK_TEST_OUT/sample.apk"

      - name: Verify sample APK with apksigner
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          tools="$sdk_root/build-tools/36.0.0"
          apk="${{ runner.temp }}/apk-sample/sample.apk"
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$apk"

      - name: Inspect manifest with aapt2
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          tools="$sdk_root/build-tools/36.0.0"
          apk="${{ runner.temp }}/apk-sample/sample.apk"
          dump="${{ runner.temp }}/manifest-tree.txt"
          # xmltree reads the binary manifest directly, so it works for an APK
          # that deliberately has no resources.arsc.
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | tee "$dump"
          grep -q 'package="dev.example.hello"' "$dump"
          grep -q 'android.app.NativeActivity' "$dump"
          grep -q 'android.app.lib_name' "$dump"
          grep -q 'android.intent.action.MAIN' "$dump"

      - name: Upload sample APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packager-sample-apk
          path: ${{ runner.temp }}/apk-sample/
          if-no-files-found: ignore
